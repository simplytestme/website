simplytest_ocd.ocd:
  path: '/one-click-demos'
  methods: [GET]
  defaults:
    _controller: '\Drupal\simplytest_ocd\Controller\Resources::info'
  requirements:
    _access: 'TRUE'
    _format: 'json'
simplytest_ocd.launch:
  path: '/one-click-demos/{oneclickdemo_id}'
  methods: [POST]
  defaults:
    _controller: '\Drupal\simplytest_ocd\Controller\Resources::launch'
  requirements:
    _access: 'TRUE'
    _format: 'json'
simplytest_ocd.site_templates:
  path: '/site-templates'
  methods: [GET]
  defaults:
    _controller: '\Drupal\simplytest_ocd\Controller\Resources::siteTemplates'
  requirements:
    _access: 'TRUE'
    _format: 'json'
simplytest_ocd.site_template:
  path: '/template/{machine_name}'
  methods: [GET]
  defaults:
    _controller: '\Drupal\simplytest_ocd\Controller\Resources::siteTemplate'
    _title_callback: '\Drupal\simplytest_ocd\Controller\Resources::siteTemplateTitle'
  requirements:
    _access: 'TRUE'
    machine_name: '[a-z0-9_]+'
