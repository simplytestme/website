simplytest_projects.settings:
  type: config_object
  label: 'Simply Test Project Settings'
  mapping:
    version_timeout:
      type: string
      label: 'Maximum age of version data'
    blacklisted_projects:
      type: sequence
      label: 'Blacklisted projects'
      sequence:
        type: string
        label: 'Project shortname'
    blacklisted_versions:
      type: sequence
      label: 'Blacklisted versions'
      sequence:
        type: string
        label: 'Version pattern'
