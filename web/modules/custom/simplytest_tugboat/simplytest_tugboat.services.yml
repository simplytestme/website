services:
  logger.channel.simplytest_tugboat:
    parent: logger.channel_base
    arguments: ['simplytest_tugboat']
  simplytest_tugboat.instance_manager:
    class: Drupal\simplytest_tugboat\InstanceManager
    arguments:
      - '@config.factory'
      - '@logger.channel.simplytest_tugboat'
      - '@module_handler'
      - '@tugboat.client'
      - '@simplytest_tugboat.preview_config_generator'
      - '@simplytest_tugboat.launch_recorder'
  simplytest_tugboat.preview_config_generator:
    class: Drupal\simplytest_tugboat\PreviewConfigGenerator
    arguments: ['@plugin.manager.oneclickdemo']
  simplytest_tugboat.launch_recorder:
    class: Drupal\simplytest_tugboat\LaunchRecorder
    arguments:
      - '@database'
      - '@datetime.time'
      - '@logger.channel.simplytest_tugboat'
  simplytest_tugboat.launch_statistics:
    class: Drupal\simplytest_tugboat\LaunchStatistics
    arguments:
      - '@database'
      - '@datetime.time'
